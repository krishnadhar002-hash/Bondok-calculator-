<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বন্ধক হিসাব</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 500px; margin: 0 auto; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; color: var(--accent); }
    .header p { font-size: 0.85rem; color: var(--subtext); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; color: var(--subtext); margin-bottom: 4px; }
    input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0b1120; color: #fff; font-size: 0.95rem; }
    input:focus { outline: none; border-color: var(--accent); }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent); color: #0f172a; font-weight: bold; cursor: pointer; margin-top: 8px; }
    
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: center; }
    .summary-box { background: #0b1120; padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
    .summary-box span { font-size: 0.75rem; color: var(--subtext); display: block; }
    .summary-box strong { font-size: 1.1rem; color: var(--accent); }

    .item { background: #0b1120; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-top: 10px; position: relative; }
    .item h4 { font-size: 1rem; color: var(--text); margin-bottom: 4px; }
    .item p { font-size: 0.8rem; color: var(--subtext); margin: 2px 0; }
    .item .calc { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); display: flex; justify-content: space-between; font-weight: bold; font-size: 0.9rem; }
    .del-btn { position: absolute; top: 10px; right: 10px; background: transparent; color: var(--danger); border: none; font-size: 1rem; cursor: pointer; width: auto; padding: 0; margin: 0; }
  </style>
</head>
<body>

  <div class="header">
    <h1>বন্ধক হিসাব খাতা</h1>
    <p>মাসিক লাভ ও মোট পাওনার সহজ হিসাব</p>
  </div>

  <div class="card summary-grid">
    <div class="summary-box">
      <span>মোট মূল টাকা</span>
      <strong id="totalPrincipal">৳০</strong>
    </div>
    <div class="summary-box">
      <span>মোট পাওনা (লাভসহ)</span>
      <strong id="totalPayable">৳০</strong>
    </div>
  </div>

  <div class="card">
    <h3 style="font-size: 1rem; margin-bottom: 12px; color: var(--accent);">নতুন হিসাব যুক্ত করুন</h3>
    <form id="loanForm">
      <div class="form-group">
        <label>গ্রাহকের নাম / বিবরণ</label>
        <input type="text" id="name" placeholder="যেমন: রহিমের সোনার চেইন" required>
      </div>
      <div class="grid">
        <div class="form-group">
          <label>মূল টাকা (৳)</label>
          <input type="number" id="principal" placeholder="১০০০০" required>
        </div>
        <div class="form-group">
          <label>মাসিক লাভ (%)</label>
          <input type="number" id="rate" step="0.1" value="৩" required>
        </div>
      </div>
      <div class="form-group">
        <label>জমা দেওয়ার তারিখ</label>
        <input type="date" id="startDate" required>
      </div>
      <button type="submit">+ হিসাব যুক্ত করুন</button>
    </form>
  </div>

  <div class="card">
    <h3 style="font-size: 1rem; margin-bottom: 8px;">চলমান তালিকা</h3>
    <div id="listContainer"></div>
  </div>

  <script>
    document.getElementById('startDate').valueAsDate = new Date();

    function getStorage() {
      return JSON.parse(localStorage.getItem('bondhok_records')) || [];
    }

    function saveStorage(data) {
      localStorage.setItem('bondhok_records', JSON.stringify(data));
      render();
    }

    function calculate(principal, rate, startDateStr) {
      const start = new Date(startDateStr);
      const now = new Date();
      const diffTime = Math.max(0, now - start);
      const days = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      
      // ৩০ দিনে ১ মাস হিসাব
      const months = days / 30;
      const profit = principal * (rate / 100) * months;
      const total = principal + profit;

      return {
        days: days,
        months: months.toFixed(1),
        profit: Math.round(profit),
        total: Math.round(total)
      };
    }

    function render() {
      const records = getStorage();
      const container = document.getElementById('listContainer');
      container.innerHTML = '';

      let sumPrincipal = 0;
      let sumPayable = 0;

      if (records.length === 0) {
        container.innerHTML = '<p style="font-size:0.85rem; color:var(--subtext); text-align:center; padding:10px 0;">কোনো চলমান হিসাব নেই</p>';
      }

      records.forEach((item, index) => {
        const cal = calculate(item.principal, item.rate, item.startDate);
        sumPrincipal += Number(item.principal);
        sumPayable += cal.total;

        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <button class="del-btn" onclick="deleteItem(${index})">✕</button>
          <h4>${item.name}</h4>
          <p>মূল টাকা: ৳${Number(item.principal).toLocaleString('bn-BD')} | হার: ${item.rate}%</p>
          <p>তারিখ: ${item.startDate} (${cal.days} দিন / ~${cal.months} মাস)</p>
          <div class="calc">
            <span style="color: var(--accent);">লাভ: ৳${cal.profit.toLocaleString('bn-BD')}</span>
            <span style="color: var(--success);">মোট: ৳${cal.total.toLocaleString('bn-BD')}</span>
          </div>
        `;
        container.appendChild(div);
      });

      document.getElementById('totalPrincipal').innerText = '৳' + sumPrincipal.toLocaleString('bn-BD');
      document.getElementById('totalPayable').innerText = '৳' + sumPayable.toLocaleString('bn-BD');
    }

    document.getElementById('loanForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const principal = parseFloat(document.getElementById('principal').value);
      const rate = parseFloat(document.getElementById('rate').value);
      const startDate = document.getElementById('startDate').value;

      const records = getStorage();
      records.unshift({ name, principal, rate, startDate });
      saveStorage(records);

      this.reset();
      document.getElementById('startDate').valueAsDate = new Date();
      document.getElementById('rate').value = "3";
    });

    function deleteItem(index) {
      if (confirm('হিসাবটি মুছে ফেলতে চান?')) {
        const records = getStorage();
        records.splice(index, 1);
        saveStorage(records);
      }
    }

    render();
  </script>
</body>
</html>
